@media(max-width:760px){
  .brand{display:none}
  .top{

    overflow-x:auto;

  }
  .modes{flex:none}
  .tool{padding:7px 8px;font-size:11px}
  .status{height:28px;padding:6px 8px}

    height:calc(100vh - 80px);
    display:block;
    position:relative
  }

    display:none;
    position:absolute;
    z-index:20;

  }

  }

    width:100%;
    height:100%
  }

  .editorWrap textarea{
    font-size:14px;
    padding:12px;
    width:100%;
    height:100%
  }

  .preview{
    display:none;
    position:absolute;
    z-index:18;
    inset:0;
    border:0
  }

    display:none;
    position:absolute;

    left:0;
    right:0;
    bottom:0;
    height:min(48vh,330px);

  }

    padding:16px;

    gap:8px
  }

}

function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function driveConnect(){let id=localStorage.getItem(DB+'.gcid')||GOOGLE_CLIENT_ID;if(!id)return msg('Set Google OAuth Client ID in Settings','warn');if(!window.google?.accounts?.oauth2)return msg('Google sign-in library still loading','warn');let client=google.accounts.oauth2.initTokenClient({client_id:id,scope:'https://www.googleapis.com/auth/drive.file',callback:r=>{if(r.error)return msg('Google Drive auth failed','bad');token=r.access_token;$('cloud').textContent='Google Drive connected';msg('Google Drive connected')}});client.requestAccessToken({prompt:''})}
async function findDriveProject(){let q=encodeURIComponent("name='MyCodingStudioProject.json' and trashed=false");let r=await fetch('https://www.googleapis.com/drive/v3/files?q='+q+'&orderBy=modifiedTime%20desc&pageSize=10&fields=files(id,name,modifiedTime)',{headers:{Authorization:'Bearer '+token}});let x=await r.json();if(!r.ok)throw Error(x.error?.message||'Drive search failed');return x.files?.[0]||null}
async function driveSave(){saveIfOpen();if(!token)return msg('Connect Google Drive first','warn');let body=JSON.stringify({format:'MyCodingStudioProjectV1',files});try{let existing=await findDriveProject(),r;if(existing){r=await fetch('https://www.googleapis.com/upload/drive/v3/files/'+encodeURIComponent(existing.id)+'?uploadType=media&fields=id,modifiedTime',{method:'PATCH',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body})}else{let meta={name:'MyCodingStudioProject.json',mimeType:'application/json'};let boundary='mcs_'+Date.now(),payload=`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${boundary}--`;r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'multipart/related; boundary='+boundary},body:payload})}let x=await r.json();if(!r.ok)throw Error(x.error?.message||'Drive save failed');localStorage.setItem(DB+'.driveFile',x.id);msg('Google Drive saved')}catch(e){msg(e.message,'bad')}}
async function driveLoad(){if(!token)return msg('Connect Google Drive first','warn');try{let id=localStorage.getItem(DB+'.driveFile');if(!id){let found=await findDriveProject();if(!found)return msg('No My Coding Studio project found in Google Drive','warn');id=found.id;localStorage.setItem(DB+'.driveFile',id)}let r=await fetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(id)+'?alt=media',{headers:{Authorization:'Bearer '+token}});if(r.status===404){localStorage.removeItem(DB+'.driveFile');let found=await findDriveProject();if(!found)throw Error('No My Coding Studio project found in Google Drive');id=found.id;localStorage.setItem(DB+'.driveFile',id);r=await fetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(id)+'?alt=media',{headers:{Authorization:'Bearer '+token}})}let x=await r.json();if(!r.ok)throw Error(x.error?.message||'Drive load failed');if(x.format!=='MyCodingStudioProjectV1'||!x.files||typeof x.files!=='object')throw Error('Invalid project file');files=x.files;persist();tabs={};current=null;$('editor').value='';refresh();msg('Google Drive project loaded')}catch(e){msg(e.message,'bad')}}
async function diagnostics(){saveIfOpen();let checks=[['Local storage',(()=>{try{localStorage.setItem(DB+'.test','1');localStorage.removeItem(DB+'.test');return true}catch{return false}})()],['Workspace files',Object.keys(files).length>0],['Safe path guard',!Object.keys(files).some(x=>x.includes('..')||x.startsWith('/'))],['HTML preview',true],['JavaScript browser engine',(()=>{try{return new Function('return 6*7')()===42}catch{return false}})()],['Python browser runtime',typeof Worker!=='undefined'],['Google Drive configured',!!(localStorage.getItem(DB+'.gcid')||GOOGLE_CLIENT_ID)],['Google Drive authenticated',!!token],['Cloud runner configured',!!localStorage.getItem(DB+'.runner')]];modal('Diagnostics');$('results').textContent=checks.map(([n,v])=>`${v?'PASS ✓':'PENDING'}  ${n}`).join('\n')+'\n\nChecking cloud toolchains…';if(localStorage.getItem(DB+'.runner')){$('results').textContent+='\n'+(await runnerDiagnostics()).join('\n')}else $('results').textContent+='\nPENDING  Cloud toolchains'}

let studioMode='code', previewVisible=true, termHistory=[], termHistoryIndex=0;
function setMode(mode){studioMode=mode;document.body.dataset.mode=mode;$('codeMode').classList.toggle('activeMode',mode==='code');$('docsMode').classList.toggle('activeMode',mode==='documents');$('documentsPane').hidden=mode!=='documents';$('codePane').hidden=mode!=='code';msg(mode==='code'?'Code workspace':'Documents workspace');updateContext()}
function updateContext(){let ext=(current||'').split('.').pop().toLowerCase();let android=Object.keys(files).some(x=>x==='settings.gradle' || x==='app/build.gradle');$('androidBuild').hidden=!android;$('ctx').textContent=studioMode==='documents'?'DOCUMENTS':(ext?ext.toUpperCase():'CODE')}
function moreMenu(){modal('More Tools');$('controls').innerHTML='<button onclick="driveConnect()">Google Drive</button> <button onclick="driveSave()">Drive Save</button> <button onclick="driveLoad()">Drive Load</button> <button onclick="gitPanel()">Git</button> <button onclick="newAndroidApp()">New Android App</button> <button onclick="settings()">Settings</button> <button onclick="diagnostics()">Diagnostics</button>'}
function systemView(){modal('System');let runner=localStorage.getItem(DB+'.runner')?'✓ Cloud runner configured':'⚠ Cloud runner not configured';let drive=token?'✓ Google Drive connected':'○ Google Drive not connected';$('results').textContent='Runtime: Browser + optional Cloud\n'+runner+'\n'+drive+'\nWorkspace files: '+Object.keys(files).length+'\nCurrent: '+(current||'none')}
function togglePreview(){previewVisible=!previewVisible;$('previewPane').hidden=!previewVisible;$('viewerToggle').textContent=previewVisible?'Hide Viewer':'Show Viewer';if(previewVisible)updatePreview()}
function updatePreview(){if(!$('previewFrame'))return;let html='';if(current?.endsWith('.html')) html=files[current]??$('editor').value;else if(current?.endsWith('.md')) html='<style>body{font-family:system-ui;padding:24px}</style><pre>'+esc(files[current]??$('editor').value)+'</pre>';else html='<style>body{font-family:system-ui;background:#0d1117;color:#8b949e;padding:24px}</style><h3>Live Viewer</h3><p>Open an HTML file for live preview.</p>';$('previewFrame').srcdoc=html}
async function terminalTyped(){let i=$('termInput'),cmd=i.value.trim();if(!cmd)return;termHistory.push(cmd);termHistoryIndex=termHistory.length;i.value='';$('terminalLog').textContent+='\n$ '+cmd+'\n';if(cmd==='clear'){ $('terminalLog').textContent='';return }try{let x=await runnerRequest({action:'command',command:cmd,files});$('terminalLog').textContent+=(x.output||'(no output)')+'\n';msg('Terminal command finished')}catch(e){$('terminalLog').textContent+='ERROR: '+e.message+'\n';msg('Terminal command failed','bad')} $('terminalLog').scrollTop=$('terminalLog').scrollHeight}
function toggleTerminal(){let p=$('terminalPanel');p.hidden=!p.hidden;if(!p.hidden)$('termInput').focus()}
function voiceReady(){if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window))return msg('Voice is not supported in this browser','warn');let R=window.SpeechRecognition||window.webkitSpeechRecognition,r=new R();r.lang='en-IN';r.onstart=()=>msg('Listening…','warn');r.onresult=e=>{let t=e.results[0][0].transcript;$('editor').focus();let a=$('editor').selectionStart;$('editor').setRangeText(t,a,$('editor').selectionEnd,'end');$('editor').dispatchEvent(new Event('input'));msg('Voice text inserted')};r.onerror=()=>msg('Voice input failed','bad');r.start()}
function docNew(type){let names={word:'Document.md',excel:'Workbook.csv',slides:'Slides.md',pdf:'PDF-notes.md',text:'Notes.txt',vba:'Module1.bas'};let n=names[type]||'Document.txt';if(files[n]!=null)n=Date.now()+'-'+n;files[n]='';persist();refresh();setMode('code');openFile(n);msg(type.toUpperCase()+' document created')}
$('termInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();terminalTyped()}else if(e.key==='ArrowUp'){e.preventDefault();if(termHistory.length){termHistoryIndex=Math.max(0,termHistoryIndex-1);e.target.value=termHistory[termHistoryIndex]||''}}else if(e.key==='ArrowDown'){e.preventDefault();termHistoryIndex=Math.min(termHistory.length,termHistoryIndex+1);e.target.value=termHistory[termHistoryIndex]||''}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();runCurrent()}if((e.ctrlKey||e.metaKey)&&e.key==='`'){e.preventDefault();toggleTerminal()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='p'){e.preventDefault();quickOpen()}});
$('editor').addEventListener('input',()=>{updatePreview()});
const _openFile=openFile;openFile=function(p){_openFile(p);updateContext();updatePreview()};
const _refresh=refresh;refresh=function(){_refresh();updateContext()};

load();updateContext();updatePreview();

function isMobileStudio(){
  return window.matchMedia('(max-width:760px)').matches;
}

function mobileFiles(){
  const e=document.querySelector('.explorer');
  if(!e)return;
  e.classList.toggle('mobileOpen');
}

function mobileCloseFiles(){
  const e=document.querySelector('.explorer');
  if(e)e.classList.remove('mobileOpen');
}

/* V6.1 override: viewer becomes on-demand full panel on phone */
togglePreview=function(){
  const p=$('previewPane');
  if(isMobileStudio()){
    p.classList.toggle('mobileOpen');
    previewVisible=p.classList.contains('mobileOpen');
  }else{
    previewVisible=!previewVisible;
    p.hidden=!previewVisible;
  }
  if($('viewerToggle'))
    $('viewerToggle').textContent=previewVisible?'Hide Viewer':'Show Viewer';
  if(previewVisible)updatePreview();
};

/* V6.1 override: terminal becomes bottom drawer on phone */
toggleTerminal=function(){
  const p=$('terminalPanel');
  if(isMobileStudio()){
    p.classList.toggle('mobileOpen');
    p.hidden=false;
    if(p.classList.contains('mobileOpen'))$('termInput').focus();
  }else{
    p.hidden=!p.hidden;
    if(!p.hidden)$('termInput').focus();
  }
};

function v61MobileInit(){
  if(!isMobileStudio())return;

  const terminal=$('terminalPanel');
  terminal.hidden=false;
  terminal.classList.remove('mobileOpen');

  const preview=$('previewPane');
  preview.hidden=false;
  preview.classList.remove('mobileOpen');
  previewVisible=false;

  /* Add Files control without disturbing existing desktop tools */
  const top=document.querySelector('.top');
  if(top && !$('mobileFilesBtn')){
    const b=document.createElement('button');
    b.id='mobileFilesBtn';
    b.className='tool';
    b.textContent='Files';
    b.onclick=mobileFiles;
    const modes=top.querySelector('.modes');
    if(modes) modes.after(b); else top.prepend(b);
  }
}

/* Close Files after selecting a file on phone */
const v61OpenFile=openFile;
openFile=function(path){
  v61OpenFile(path);
  if(isMobileStudio())mobileCloseFiles();
};

window.addEventListener('resize',()=>{
  if(!isMobileStudio()){
    document.querySelector('.explorer')?.classList.remove('mobileOpen');
    $('previewPane')?.classList.remove('mobileOpen');
    $('terminalPanel')?.classList.remove('mobileOpen');
  }
});

v61MobileInit();

</script></body></html>
